sentence=Relay bike sensor data (Heart Rate, Speed/Cadence, Power Meter) from BLE sensors to a local GATT server using ESP32 with NimBLE-Arduino 2.x.
paragraph=Wraps bike sensor connection and data relay functionality into reusable setup/loop helpers that mirror sensor data to connected centrals. Uses NimBLE-Arduino 2.x library (REQUIRED: version 2.x only, NOT compatible with 1.x). Implements name-based connection workflow for robust sensor discovery and connection.
