name=BluetoothBikeSensorServer
version=3.0.0
author=Martin Lihs
maintainer=Martin Lihs
sentence=Relay bike sensor data (Heart Rate, Speed/Cadence, Power Meter) from BLE sensors to a local GATT server using ESP32 with NimBLE-Arduino 2.5+.
paragraph=One update() call on the application task drives non-blocking sensor connects (by MAC or by name), discovery, the relay server and a one-way quiesce for OTA. Include BikeSensor.h. Requires NimBLE-Arduino 2.5.0 or newer.
category=Communication
url=https://github.com/mLihs/BluetoothBikeSensorServer
architectures=esp32
depends=NimBLE-Arduino (>=2.5.0)
